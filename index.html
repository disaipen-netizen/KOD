<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KOD</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: #0d0f14 !important; color-scheme: dark only !important; }

  body {
    min-height: 100vh;
    height: 100%;
    color: #f0ebe3;
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    overflow-y: auto; scrollbar-width: none;
  }

  /* Ambient top glow */
  body::after {
    content: '';
    position: fixed;
    top: -15%;
    left: 50%;
    transform: translateX(-50%);
    width: 70vw;
    height: 70vw;
    background: radial-gradient(ellipse, rgba(201,169,110,0.07) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  /* LANG BAR */
  #langBar {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 7px;
    z-index: 100;
  }

  .lang-btn {
    background: #0d0f14;
    border: 1px solid rgba(201,169,110,0.3);
    color: rgba(240,235,227,0.4);
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.12em;
    padding: 6px 10px;
    cursor: pointer;
    transition: all 0.3s;
    -webkit-tap-highlight-color: transparent;
  }

  .lang-btn.active { border-color: #c9a96e; color: #c9a96e; }

  /* ── WELCOME ── */
  #welcome {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #0d0f14;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    text-align: center;
    animation: fadeUp 1s ease forwards;
  }

  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 64px;
    font-weight: 300;
    letter-spacing: 0.45em;
    color: #c9a96e;
    line-height: 1;
  }

  .brand-line {
    width: 40px;
    height: 1px;
    background: rgba(201,169,110,0.3);
    margin: 20px auto 22px;
  }

  .tagline {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(240,235,227,0.4);
    margin-bottom: 56px;
    line-height: 1.8;
  }

  .choose-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(240,235,227,0.35);
    margin-bottom: 18px;
  }

  .archetype-card {
    border: 1px solid rgba(201,169,110,0.3);
    padding: 22px 48px;
    cursor: pointer;
    width: 260px;
    background: rgba(201,169,110,0.03);
    transition: all 0.3s;
    -webkit-tap-highlight-color: transparent;
  }

  .archetype-card:active {
    border-color: #c9a96e;
    background: rgba(201,169,110,0.08);
  }

  .arch-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    letter-spacing: 0.12em;
    color: #f0ebe3;
  }

  .arch-sub {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(240,235,227,0.4);
    margin-top: 7px;
  }

  /* ── CHAT LAYOUT ── */
  #chat {
    display: none;
    position: fixed;
    inset: 0;
    flex-direction: column;
    background: #0d0f14;
  }

  /* TOP: header + message — takes ~65% of screen */
  .chat-top {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 28px 16px;
    min-height: 0;
    position: relative;
    z-index: 1;
  }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  .chat-brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    letter-spacing: 0.35em;
    color: #c9a96e;
  }

  .chat-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #c9a96e;
    opacity: 0.45;
  }

  .chat-persona {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(240,235,227,0.4);
  }

  .step-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 24px;
    flex-shrink: 0;
    transition: opacity 0.5s;
  }

  .step-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    transition: all 0.4s;
  }

  .step-dot.active { background: #c9a96e; transform: scale(1.4); }
  .step-dot.done   { background: rgba(201,169,110,0.3); }

  /* Message block — sits in top 2/3 */
  .message-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding-top: 8px;
    overflow-y: auto; scrollbar-width: none;
  }

  /* Typing dots */
  .typing {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    min-height: 14px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .typing.visible { opacity: 1; }

  .typing span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #c9a96e;
    animation: blink 1.4s ease infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  /* Papa text — large, top area */
  #papaMsg {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 300;
    line-height: 1.75;
    color: #f0ebe3;
    white-space: pre-line;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.8s ease, transform 0.8s ease, color 0.4s ease;
  }

  #papaMsg.visible { opacity: 1; transform: translateY(0); }
  #papaMsg.dim     { opacity: 0.35; }

  /* User echo (small, below papa text) */
  #userEcho {
    font-size: 15px;
    color: rgba(240,235,227,0.4);
    font-style: italic;
    line-height: 1.5;
    margin-top: 16px;
    opacity: 0;
    transition: opacity 0.5s;
  }

  #userEcho.visible { opacity: 1; }

  /* ── BOTTOM: input — always visible, fixed ── */
  .chat-bottom {
    flex-shrink: 0;
    padding: 16px 28px 32px;
    border-top: 2px solid rgba(201,169,110,0.25);
    background: #0d0f14;
    position: relative;
    z-index: 2;
  }

  .input-wrap {
    position: relative;
    border: 1px solid rgba(201,169,110,0.3); border-radius: 4px; padding: 0 8px;
    transition: border-color 0.3s;
    margin-bottom: 4px;
  }

  .input-wrap:focus-within { border-color: #c9a96e; }

  #userInput {
    width: 100%;
    background: rgba(201,169,110,0.04);
    border: none;
    outline: none;
    color: #f0ebe3;
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 17px;
    letter-spacing: 0.03em;
    padding: 12px 44px 12px 0;
    resize: none;
    min-height: 50px;
    max-height: 120px;
    line-height: 1.5;
    caret-color: #c9a96e;
    transition: opacity 0.3s;
  }

  #userInput::placeholder {
    color: rgba(240,235,227,0.28);
    font-size: 14px;
    letter-spacing: 0.08em;
  }

  .send-btn {
    position: absolute;
    right: 0;
    bottom: 10px;
    background: none;
    border: none;
    cursor: pointer;
    color: #c9a96e;
    opacity: 0.6;
    transition: opacity 0.3s;
    padding: 4px;
    -webkit-tap-highlight-color: transparent;
  }

  .send-btn:active { opacity: 1; }
  .send-btn svg { width: 22px; height: 22px; }

  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .qr-btn {
    background: rgba(201,169,110,0.04);
    border: 1px solid rgba(201,169,110,0.25);
    color: rgba(240,235,227,0.45);
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 9px 16px;
    cursor: pointer;
    transition: all 0.3s;
    -webkit-tap-highlight-color: transparent;
  }

  .qr-btn:active {
    border-color: #c9a96e;
    color: #f0ebe3;
    background: rgba(201,169,110,0.06);
  }

  /* Input disabled state */
  .input-disabled #userInput { opacity: 0.3; pointer-events: none; }
  .input-disabled .send-btn  { opacity: 0.2; pointer-events: none; }

  /* ── FINAL CARD ── */
  #finalCard {
    display: none;
    position: fixed;
    inset: 0;
    background: #0d0f14;
    z-index: 20;
    overflow-y: auto;
    padding: 48px 28px 40px;
    animation: fadeUp 0.8s ease forwards;
  }

  .contract-label {
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #c9a96e;
    margin-bottom: 8px;
    text-align: center;
  }

  .papa-closing {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    line-height: 1.7;
    color: rgba(240,235,227,0.7);
    text-align: center;
    margin-bottom: 28px;
    font-style: italic;
  }

  .contract-box {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    line-height: 1.95;
    color: #f0ebe3;
    border: 1px solid rgba(201,169,110,0.3);
    padding: 28px 24px;
    margin-bottom: 28px;
    text-align: left;
    position: relative;
  }

  .contract-box::before,
  .contract-box::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: #c9a96e;
    border-style: solid;
  }

  .contract-box::before { top:-1px; left:-1px; border-width: 1px 0 0 1px; }
  .contract-box::after  { bottom:-1px; right:-1px; border-width: 0 1px 1px 0; }

  .gold { color: #c9a96e; font-style: italic; }

  .restart-btn {
    background: rgba(201,169,110,0.04);
    border: 1px solid #c9a96e;
    color: #c9a96e;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    padding: 17px 32px;
    cursor: pointer;
    width: 100%;
    transition: all 0.4s;
    -webkit-tap-highlight-color: transparent;
  }

  .restart-btn:active { background: #c9a96e; color: #0d0f14; }

  /* LOADER */
  #loader {
    position: fixed;
    inset: 0;
    background: #0d0f14;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    transition: opacity 0.8s ease;
  }

  #loader .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 52px;
    letter-spacing: 0.5em;
    color: #c9a96e;
    animation: breathe 2s ease infinite;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes blink {
    0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; }
    40%           { transform: scale(1); opacity: 1; }
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.4; }
    50%       { opacity: 1; }
  }
</style>
</head>
<body>

<div id="loader"><div class="logo">KOD</div></div>

<div id="langBar">
  <button class="lang-btn active" onclick="setLang('ru')">RU</button>
  <button class="lang-btn" onclick="setLang('kz')">KZ</button>
  <button class="lang-btn" onclick="setLang('en')">EN</button>
</div>

<!-- WELCOME -->
<div id="welcome">
  <div class="brand">KOD</div>
  <div class="brand-line"></div>
  <div class="tagline" id="tagline">Перепиши свой финансовый код</div>
  <div class="choose-label" id="chooseLabel">Выбери проводника</div>
  <div class="archetype-card" onclick="startChat()">
    <div class="arch-name" id="archName">Папа</div>
    <div class="arch-sub" id="archSub">Действие · Защита · Опора</div>
  </div>
</div>

<!-- CHAT -->
<div id="chat">
  <div class="chat-top">
    <div class="chat-header">
      <div class="chat-brand">KOD</div>
      <div class="chat-dot"></div>
      <div class="chat-persona" id="personaLabel">Папа</div>
    </div>
    <div class="step-dots" id="stepDots"></div>
    <div class="message-block">
      <div class="typing" id="typing"><span></span><span></span><span></span></div>
      <div id="papaMsg"></div>
      <div id="userEcho"></div>
    </div>
  </div>

  <div class="chat-bottom" id="chatBottom">
    <div class="input-wrap">
      <textarea id="userInput" rows="1" placeholder="Напиши здесь..."></textarea>
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
    <div class="quick-replies" id="quickReplies"></div>
  </div>
</div>

<!-- FINAL -->
<div id="finalCard">
  <div class="contract-label" id="contractLabel">Твой новый KOD</div>
  <div class="papa-closing" id="papaClosing"></div>
  <div class="contract-box" id="contractBox"></div>
  <button class="restart-btn" id="restartBtn" onclick="resetApp()">Начать заново</button>
</div>

<script>
const UI = {
  ru: {
    tagline: 'Перепиши свой финансовый код',
    chooseLabel: 'Выбери проводника',
    archName: 'Папа', archSub: 'Действие · Защита · Опора',
    personaLabel: 'Папа',
    contractLabel: 'Твой новый KOD',
    restartBtn: 'Начать заново',
    placeholder: 'Напиши здесь...',
    thinking: 'Папа думает...',
    quick1: ['Страх', 'Обиду', 'Стыд', 'Растерянность', 'Злость'],
    quick7: ['Спасибо', 'Я тебя вижу. Спасибо', 'Спасибо, ты меня защищала'],
    contractTemplate: (d) =>
      `Я признаю опыт <span class="gold">${d.age}-летней</span> версии себя.<br><br>` +
      `Её решение: <span class="gold">${d.decision}</span><br><br>` +
      `Я благодарю <span class="gold">${d.name}</span> за защиту.<br><br>` +
      `Сегодня я выбираю:<br><span class="gold">${d.newDecision}</span><br><br>` +
      `Мой первый шаг —<br><span class="gold">${d.action}</span>`
  },
  kz: {
    tagline: 'Өзіңнің қаржылық кодыңды қайта жаз',
    chooseLabel: 'Жетекшіні таңда',
    archName: 'Әке', archSub: 'Іс-әрекет · Қорғау · Тіреу',
    personaLabel: 'Әке',
    contractLabel: 'Сенің жаңа KOD-ың',
    restartBtn: 'Қайтадан бастау',
    placeholder: 'Осында жаз...',
    thinking: 'Әке ойлануда...',
    quick1: ['Қорқыныш', 'Реніш', 'Ұят', 'Абыржу', 'Ашу'],
    quick7: ['Рахмет', 'Сені көріп тұрмын. Рахмет', 'Рахмет, сен мені қорғадың'],
    contractTemplate: (d) =>
      `Мен <span class="gold">${d.age} жастағы</span> өзімнің тәжірибемді мойындаймын.<br><br>` +
      `Оның шешімі: <span class="gold">${d.decision}</span><br><br>` +
      `Мен <span class="gold">${d.name}</span> рахмет айтамын.<br><br>` +
      `Бүгін мен таңдаймын:<br><span class="gold">${d.newDecision}</span><br><br>` +
      `Менің алғашқы қадамым —<br><span class="gold">${d.action}</span>`
  },
  en: {
    tagline: 'Rewrite your financial code',
    chooseLabel: 'Choose your guide',
    archName: 'Father', archSub: 'Action · Protection · Strength',
    personaLabel: 'Father',
    contractLabel: 'Your new KOD',
    restartBtn: 'Start over',
    placeholder: 'Write here...',
    thinking: 'Father is thinking...',
    quick1: ['Fear', 'Resentment', 'Shame', 'Confusion', 'Anger'],
    quick7: ['Thank you', 'I see you. Thank you', 'Thank you for protecting me'],
    contractTemplate: (d) =>
      `I acknowledge the experience of my <span class="gold">${d.age}-year-old</span> self.<br><br>` +
      `Her decision: <span class="gold">${d.decision}</span><br><br>` +
      `I thank <span class="gold">${d.name}</span> for her protection.<br><br>` +
      `Today I choose:<br><span class="gold">${d.newDecision}</span><br><br>` +
      `My first step —<br><span class="gold">${d.action}</span>`
  }
};

let lang = 'ru';
let messages = []; // conversation history for API
let step = 0;
let isLoading = false;

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.textContent === l.toUpperCase())
  );
  const u = UI[l];
  document.getElementById('tagline').textContent = u.tagline;
  document.getElementById('chooseLabel').textContent = u.chooseLabel;
  document.getElementById('archName').textContent = u.archName;
  document.getElementById('archSub').textContent = u.archSub;
  document.getElementById('personaLabel').textContent = u.personaLabel;
  document.getElementById('contractLabel').textContent = u.contractLabel;
  document.getElementById('restartBtn').textContent = u.restartBtn;
  document.getElementById('userInput').placeholder = u.placeholder;
}

function startChat() {
  document.getElementById('welcome').style.display = 'none';
  const chat = document.getElementById('chat');
  chat.style.display = 'flex';
  buildDots();
  // First message — Papa opens
  sendToAPI(null);
}

function buildDots() {
  const dots = document.getElementById('stepDots');
  dots.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const d = document.createElement('div');
    d.className = 'step-dot' + (i === 0 ? ' active' : '');
    d.id = `dot-${i}`;
    dots.appendChild(d);
  }
}

function updateDot(n) {
  for (let i = 0; i < 9; i++) {
    const d = document.getElementById(`dot-${i}`);
    if (d) d.className = 'step-dot' + (i < n ? ' done' : i === n ? ' active' : '');
  }
}

async function sendToAPI(userText) {
  if (isLoading) return;
  isLoading = true;

  // Add user message to history
  if (userText !== null) {
    messages.push({ role: 'user', content: userText });
    step++;
    updateDot(Math.min(step, 8));
  }

  // Show typing
  showTyping(true);
  setInputDisabled(true);

  // Dim papa text while thinking
  document.getElementById('papaMsg').classList.add('dim');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, lang })
    });

    const data = await res.json();

    showTyping(false);

    if (data.type === 'final' && data.data) {
      // Show final card
      messages.push({ role: 'assistant', content: data.data.text || '' });
      showFinal(data.data);
    } else {
      const text = data.text || '';
      messages.push({ role: 'assistant', content: text });
      showPapaMessage(text);
      setInputDisabled(false);
      setupQuickReplies();
      setTimeout(() => document.getElementById('userInput').focus(), 400);
    }
  } catch (err) {
    showTyping(false);
    showPapaMessage('...');
    setInputDisabled(false);
  }

  isLoading = false;
}

function showPapaMessage(text) {
  const el = document.getElementById('papaMsg');
  el.classList.remove('visible', 'dim');
  el.textContent = text;
  setTimeout(() => el.classList.add('visible'), 50);

  // Clear echo
  const echo = document.getElementById('userEcho');
  echo.classList.remove('visible');
  echo.textContent = '';
}

function showTyping(on) {
  document.getElementById('typing').classList.toggle('visible', on);
}

function setInputDisabled(disabled) {
  document.getElementById('chatBottom').classList.toggle('input-disabled', disabled);
}

function setupQuickReplies() {
  const qr = document.getElementById('quickReplies');
  qr.innerHTML = '';
  // Show quick replies only at relevant steps
  let opts = [];
  if (step === 1) opts = UI[lang].quick1;
  if (step === 6) opts = UI[lang].quick7;

  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      document.getElementById('userInput').value = opt;
      sendMessage();
    };
    qr.appendChild(btn);
  });
}

function sendMessage() {
  const input = document.getElementById('userInput');
  const val = input.value.trim();
  if (!val || isLoading) return;

  // Show echo
  const echo = document.getElementById('userEcho');
  echo.textContent = val;
  echo.classList.add('visible');

  // Dim papa
  document.getElementById('papaMsg').classList.add('dim');

  // Clear input
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('quickReplies').innerHTML = '';

  sendToAPI(val);
}

function showFinal(data) {
  document.getElementById('stepDots').style.opacity = '0';
  const card = document.getElementById('finalCard');
  document.getElementById('papaClosing').textContent = data.text || '';
  document.getElementById('contractBox').innerHTML = UI[lang].contractTemplate(data.contract || data);
  card.style.display = 'block';
}

function resetApp() {
  messages = [];
  step = 0;
  isLoading = false;
  document.getElementById('finalCard').style.display = 'none';
  document.getElementById('chat').style.display = 'none';
  document.getElementById('stepDots').style.opacity = '';
  document.getElementById('papaMsg').classList.remove('visible', 'dim');
  document.getElementById('userEcho').classList.remove('visible');
  document.getElementById('welcome').style.display = 'flex';
}

// Textarea auto-resize + Enter to send
document.addEventListener('DOMContentLoaded', () => {
  const ta = document.getElementById('userInput');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Telegram setup
  if (window.Telegram?.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    Telegram.WebApp.setHeaderColor('#0d0f14');
    Telegram.WebApp.setBackgroundColor('#0d0f14');
  }
});

// Hide loader
window.addEventListener('load', () => {
  setTimeout(() => {
    const l = document.getElementById('loader');
    l.style.opacity = '0';
    setTimeout(() => l.style.display = 'none', 800);
  }, 600);
});
</script>
</body>
</html>
